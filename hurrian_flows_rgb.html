<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hurrian Hymn – Flow Regimes + RGB Lights</title>
<style>
  :root {
    --bg: #0a0a12;
    --card: #12121f;
    --text: #e8e8f0;
    --muted: #8888a0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 1.5rem;
  }
  h1 {
    text-align: center;
    font-weight: 300;
    letter-spacing: 0.08em;
    margin-bottom: 0.3rem;
    font-size: 1.6rem;
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 1.8rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1.2rem;
    max-width: 1100px;
    margin: 0 auto 2rem;
  }
  .card {
    background: var(--card);
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid #1e1e30;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  .viz {
    height: 160px;
    position: relative;
    overflow: hidden;
  }
  canvas { width: 100%; height: 100%; display: block; }
  .info {
    padding: 0.9rem 1rem 1.1rem;
  }
  .info h2 {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 0.25rem;
  }
  .info p {
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 0.7rem;
  }
  .btns { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  button {
    background: #1a1a2e;
    color: var(--text);
    border: 1px solid #2a2a45;
    border-radius: 8px;
    padding: 0.4rem 0.9rem;
    font-size: 0.8rem;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover { background: #252540; border-color: #4a4a70; }
  button.playing { background: #2a1a3a; border-color: #a060ff; color: #d0b0ff; }
  .rgb-bar {
    height: 8px;
    width: 100%;
    border-radius: 0 0 4px 4px;
  }
  /* Full-width all-three section */
  .full {
    max-width: 1100px;
    margin: 0 auto 2rem;
  }
  .full .card { display: flex; flex-direction: column; }
  .full .viz { height: 220px; }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.75rem;
    margin-top: 1rem;
  }
</style>
</head>
<body>
  <h1>Hurrian Hymn No. 6</h1>
  <p class="subtitle">Flow regimes · RGB light simulation · Web Audio synthesis</p>

  <div class="grid" id="singles">
    <!-- cards injected by JS -->
  </div>

  <div class="grid" id="mixes">
    <!-- mix cards -->
  </div>

  <div class="full" id="allthree">
    <!-- all three -->
  </div>

  <footer>
    Simplified Dumbrill-inspired reconstruction · Original notation (~1400 BCE) remains scholarly contested<br>
    Laminar = pure sine · Oscillating = AM pulse · Turbulent = noise + jitter
  </footer>

<script>
// ---------------------------------------------------------------------------
// Note data (same melody)
// ---------------------------------------------------------------------------
const NOTE_FREQS = {
  C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392.00,A4:440.00,
  B4:493.88,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99
};
const BEAT = 0.55;
const MELODY = [
  ["E4",1.5],["G4",1.0],["A4",1.0],["G4",0.5],
  ["E4",1.5],["D4",1.0],["E4",2.0],
  ["G4",1.0],["A4",1.0],["B4",1.5],["A4",0.5],
  ["G4",1.0],["E4",1.5],["D4",1.5],
  ["E4",1.0],["G4",1.0],["A4",1.0],["C5",1.5],
  ["B4",1.0],["A4",1.0],["G4",2.0],
  ["A4",1.0],["G4",1.0],["E4",1.5],["D4",1.0],
  ["E4",3.0]
];

const PALETTES = {
  laminar:     [[30,144,255],[0,191,255],[64,224,208],[0,255,255],[100,149,237]],
  oscillating: [[50,205,50],[154,205,50],[255,215,0],[255,255,0],[124,252,0]],
  turbulent:   [[255,69,0],[255,0,0],[255,20,147],[255,140,0],[220,20,60],[148,0,211]]
};

// ---------------------------------------------------------------------------
// Web Audio synthesis
// ---------------------------------------------------------------------------
let audioCtx = null;
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playTone(ctx, freq, start, dur, type) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  const master = ctx.createGain();
  master.gain.value = 0.28;

  osc.frequency.value = freq;
  osc.type = "sine";

  // envelope
  const a = 0.02, r = 0.07;
  gain.gain.setValueAtTime(0, start);
  gain.gain.linearRampToValueAtTime(1, start + a);
  gain.gain.setValueAtTime(1, start + dur - r);
  gain.gain.linearRampToValueAtTime(0, start + dur);

  if (type === "laminar") {
    osc.connect(gain);
  } else if (type === "oscillating") {
    const lfo = ctx.createOscillator();
    const lfoGain = ctx.createGain();
    lfo.frequency.value = 4.5;
    lfoGain.gain.value = 0.45;
    lfo.connect(lfoGain);
    lfoGain.connect(gain.gain);
    lfo.start(start);
    lfo.stop(start + dur + 0.1);
    osc.connect(gain);
  } else { // turbulent
    // noise
    const bufSize = ctx.sampleRate * dur | 0;
    const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * 0.35;
    const noise = ctx.createBufferSource();
    noise.buffer = buf;
    const noiseGain = ctx.createGain();
    noiseGain.gain.value = 0.4;
    noise.connect(noiseGain);
    noiseGain.connect(gain);
    noise.start(start);
    // slight detune jitter via periodic vibrato
    const vib = ctx.createOscillator();
    const vibGain = ctx.createGain();
    vib.frequency.value = 6 + Math.random() * 4;
    vibGain.gain.value = freq * 0.012;
    vib.connect(vibGain);
    vibGain.connect(osc.frequency);
    vib.start(start);
    vib.stop(start + dur + 0.1);
    osc.connect(gain);
  }

  gain.connect(master);
  master.connect(ctx.destination);
  osc.start(start);
  osc.stop(start + dur + 0.12);
}

function playMelody(types) {
  const ctx = getCtx();
  if (ctx.state === "suspended") ctx.resume();
  let t = ctx.currentTime + 0.05;
  for (const [note, beats] of MELODY) {
    const freq = NOTE_FREQS[note];
    const dur = beats * BEAT;
    for (const type of types) {
      playTone(ctx, freq, t, dur * 0.92, type);
    }
    t += dur + 0.015;
  }
  return (t - ctx.currentTime) * 1000; // approx duration ms
}

// ---------------------------------------------------------------------------
// Canvas visualizers
// ---------------------------------------------------------------------------
class FlowViz {
  constructor(canvas, regime) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.regime = regime;
    this.particles = [];
    this.t = 0;
    this.running = true;
    this.colorIdx = 0;
    this.resize();
    this.initParticles();
    requestAnimationFrame(() => this.loop());
  }
  resize() {
    const dpr = window.devicePixelRatio || 1;
    const rect = this.canvas.getBoundingClientRect();
    this.canvas.width = rect.width * dpr;
    this.canvas.height = rect.height * dpr;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.w = rect.width;
    this.h = rect.height;
  }
  initParticles() {
    const n = this.regime === "turbulent" ? 90 : this.regime === "oscillating" ? 50 : 30;
    this.particles = [];
    for (let i = 0; i < n; i++) {
      this.particles.push({
        x: Math.random() * this.w,
        y: Math.random() * this.h,
        vx: (Math.random() - 0.5) * (this.regime === "turbulent" ? 3.5 : 1.2),
        vy: (Math.random() - 0.5) * (this.regime === "turbulent" ? 3.5 : 0.8),
        r: 2 + Math.random() * (this.regime === "turbulent" ? 5 : 3),
        phase: Math.random() * Math.PI * 2
      });
    }
  }
  getColor() {
    const pal = this.regime === "mix"
      ? [...PALETTES.laminar, ...PALETTES.oscillating, ...PALETTES.turbulent]
      : PALETTES[this.regime] || PALETTES.laminar;
    const speed = this.regime === "turbulent" || this.regime === "mix" ? 8 : this.regime === "oscillating" ? 4 : 1.5;
    const idx = Math.floor(this.t * speed) % pal.length;
    return pal[idx];
  }
  loop() {
    if (!this.running) return;
    this.t += 0.016;
    const ctx = this.ctx;
    const [r, g, b] = this.getColor();
    // background fade
    ctx.fillStyle = `rgba(10,10,18,0.25)`;
    ctx.fillRect(0, 0, this.w, this.h);

    // flowing lines / particles
    for (const p of this.particles) {
      if (this.regime === "laminar") {
        p.x += 1.4;
        p.y += Math.sin(this.t * 1.5 + p.phase) * 0.6;
        if (p.x > this.w + 10) p.x = -10;
      } else if (this.regime === "oscillating") {
        p.x += 0.9;
        p.y = this.h / 2 + Math.sin(this.t * 4 + p.phase) * (this.h * 0.35) + Math.sin(p.x * 0.02) * 8;
        if (p.x > this.w + 10) p.x = -10;
      } else if (this.regime === "turbulent") {
        p.x += p.vx;
        p.y += p.vy;
        p.vx += (Math.random() - 0.5) * 0.6;
        p.vy += (Math.random() - 0.5) * 0.6;
        p.vx *= 0.97;
        p.vy *= 0.97;
        if (p.x < 0 || p.x > this.w) p.vx *= -1;
        if (p.y < 0 || p.y > this.h) p.vy *= -1;
      } else { // mix – combination
        p.x += 1.1 + Math.sin(this.t * 3 + p.phase) * 0.8;
        p.y += Math.sin(this.t * 2.5 + p.phase) * 1.2 + (Math.random() - 0.5) * 1.5;
        if (p.x > this.w + 10) { p.x = -10; p.y = Math.random() * this.h; }
        if (p.y < 0) p.y = this.h;
        if (p.y > this.h) p.y = 0;
      }

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${r},${g},${b},0.85)`;
      ctx.fill();
      // glow
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 2.2, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${r},${g},${b},0.15)`;
      ctx.fill();
    }

    // horizontal wave overlay for laminar / oscillating
    if (this.regime === "laminar" || this.regime === "oscillating") {
      ctx.beginPath();
      for (let x = 0; x < this.w; x += 4) {
        const amp = this.regime === "laminar" ? 12 : 28;
        const freq = this.regime === "laminar" ? 0.012 : 0.025;
        const y = this.h / 2 + Math.sin(x * freq + this.t * (this.regime === "laminar" ? 1.2 : 3.5)) * amp;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = `rgba(${r},${g},${b},0.45)`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    requestAnimationFrame(() => this.loop());
  }
}

// ---------------------------------------------------------------------------
// Build UI
// ---------------------------------------------------------------------------
const singles = [
  { id: "lam", title: "Laminar Flow", desc: "Smooth, orderly pure tone – cool blues & cyans", regime: "laminar", types: ["laminar"] },
  { id: "osc", title: "Oscillating Flow", desc: "Periodic amplitude pulse – greens & yellows", regime: "oscillating", types: ["oscillating"] },
  { id: "tur", title: "Turbulent Flow", desc: "Chaos, noise & jitter – reds, oranges, magentas", regime: "turbulent", types: ["turbulent"] },
];
const mixes = [
  { id: "lo", title: "Laminar + Oscillating", desc: "Smooth tone with pulsing modulation", regime: "mix", types: ["laminar","oscillating"] },
  { id: "lt", title: "Laminar + Turbulent", desc: "Clean core with chaotic noise layer", regime: "mix", types: ["laminar","turbulent"] },
  { id: "ot", title: "Oscillating + Turbulent", desc: "Pulsing carrier + turbulent noise", regime: "mix", types: ["oscillating","turbulent"] },
];
const allThree = { id: "all", title: "All Three Combined", desc: "Laminar + Oscillating + Turbulent simultaneously", regime: "mix", types: ["laminar","oscillating","turbulent"] };

function makeCard(item, container) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="viz"><canvas id="c-${item.id}"></canvas></div>
    <div class="rgb-bar" id="bar-${item.id}"></div>
    <div class="info">
      <h2>${item.title}</h2>
      <p>${item.desc}</p>
      <div class="btns">
        <button id="btn-${item.id}">▶ Play</button>
      </div>
    </div>`;
  container.appendChild(card);

  const canvas = card.querySelector("canvas");
  const viz = new FlowViz(canvas, item.regime);
  window.addEventListener("resize", () => viz.resize());

  // RGB bar animation
  const bar = card.querySelector(`#bar-${item.id}`);
  let bi = 0;
  setInterval(() => {
    const pal = item.regime === "mix"
      ? [...PALETTES.laminar, ...PALETTES.oscillating, ...PALETTES.turbulent]
      : PALETTES[item.regime];
    const [r,g,b] = pal[bi % pal.length];
    bar.style.background = `rgb(${r},${g},${b})`;
    bi++;
  }, item.regime === "turbulent" || item.regime === "mix" ? 120 : item.regime === "oscillating" ? 220 : 400);

  const btn = card.querySelector(`#btn-${item.id}`);
  let playing = false;
  btn.addEventListener("click", () => {
    if (playing) return;
    playing = true;
    btn.classList.add("playing");
    btn.textContent = "● Playing…";
    const ms = playMelody(item.types);
    setTimeout(() => {
      playing = false;
      btn.classList.remove("playing");
      btn.textContent = "▶ Play";
    }, ms + 200);
  });
}

const singlesEl = document.getElementById("singles");
const mixesEl = document.getElementById("mixes");
const allEl = document.getElementById("allthree");

singles.forEach(s => makeCard(s, singlesEl));
mixes.forEach(m => makeCard(m, mixesEl));
makeCard(allThree, allEl);
</script>
</body>
</html>
